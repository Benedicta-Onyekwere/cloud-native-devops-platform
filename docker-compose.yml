services:

  auction-app:
    build: ./app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_NAME: auctiondb
      DB_USER: auctionuser
      DB_PASSWORD: auctionpassword
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: auctionuser
      POSTGRES_PASSWORD: auctionpassword
      POSTGRES_DB: auctiondb
    ports:
      - "5432:5432"